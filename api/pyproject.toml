[project]
name = "home-security-api"
version = "0.1.0"
description = "HTTP API over the consolidated home-security archive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pre-commit>=4.4.0",
    "pytest>=8.3",
    "ruff==0.15.12",
]

[project.scripts]
home-security-api = "home_security_api.__main__:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
